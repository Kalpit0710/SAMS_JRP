<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>SAMS - J. R. Preparatory School Attendance</title>
  <desc>Social preview for the secure bilingual school attendance management system.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="panel-clip">
      <rect x="708" y="70" width="422" height="490" rx="26"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#0b0c10"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="18" height="630" fill="#2563eb"/>

  <g transform="translate(82 72)">
    <rect width="72" height="72" rx="19" fill="#2563eb"/>
    <path d="M3 45C18 27 39 15 69 10v45c0 7.7-6.3 14-14 14H17C9.3 69 3 62.7 3 55V45Z" fill="#1d4ed8"/>
    <path d="M53 22H31c-6 0-11 3.4-11 8.2s5 8.2 11 8.2h14c6 0 11 3.4 11 8.2s-5 8.2-11 8.2H23" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="m43 52 5 5 12-14" fill="none" stroke="#6ee7b7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="176" y="112" fill="#fff" font-family="Manrope, Segoe UI, sans-serif" font-size="42" font-weight="800">SAMS</text>
  <text x="176" y="140" fill="#9ca3af" font-family="Manrope, Segoe UI, sans-serif" font-size="18" font-weight="600">J. R. PREPARATORY SCHOOL</text>

  <text x="82" y="246" fill="#fff" font-family="Manrope, Segoe UI, sans-serif" font-size="56" font-weight="800">Daily attendance,</text>
  <text x="82" y="310" fill="#60a5fa" font-family="Manrope, Segoe UI, sans-serif" font-size="56" font-weight="800">done in minutes.</text>
  <text x="82" y="370" fill="#cbd5e1" font-family="Manrope, Segoe UI, sans-serif" font-size="24">One-tap roll calls, WhatsApp absence alerts,</text>
  <text x="82" y="405" fill="#cbd5e1" font-family="Manrope, Segoe UI, sans-serif" font-size="24">live reports, and audit-ready school records.</text>

  <g transform="translate(82 462)" font-family="Manrope, Segoe UI, sans-serif" font-size="17" font-weight="700">
    <rect width="118" height="42" rx="21" fill="#132d24" stroke="#10b981" stroke-opacity=".65"/>
    <circle cx="24" cy="21" r="6" fill="#10b981"/>
    <text x="40" y="27" fill="#a7f3d0">Secure</text>
    <rect x="132" width="132" height="42" rx="21" fill="#172554" stroke="#3b82f6" stroke-opacity=".7"/>
    <circle cx="156" cy="21" r="6" fill="#60a5fa"/>
    <text x="172" y="27" fill="#bfdbfe">Bilingual</text>
    <rect x="278" width="194" height="42" rx="21" fill="#2b2111" stroke="#f59e0b" stroke-opacity=".65"/>
    <circle cx="302" cy="21" r="6" fill="#f59e0b"/>
    <text x="318" y="27" fill="#fde68a">Admin + Teacher</text>
  </g>

  <text x="82" y="570" fill="#6b7280" font-family="Manrope, Segoe UI, sans-serif" font-size="17">sams-jrp-api-ecru.vercel.app</text>

  <g clip-path="url(#panel-clip)">
    <rect x="708" y="70" width="422" height="490" rx="26" fill="#171920" stroke="#343844" stroke-width="2"/>
    <rect x="708" y="70" width="422" height="74" fill="#20232c"/>
    <circle cx="742" cy="107" r="7" fill="#10b981"/>
    <text x="760" y="113" fill="#fff" font-family="Manrope, Segoe UI, sans-serif" font-size="20" font-weight="750">Attendance overview</text>
    <text x="1094" y="112" fill="#9ca3af" text-anchor="end" font-family="Manrope, Segoe UI, sans-serif" font-size="14">Today</text>

    <rect x="738" y="170" width="172" height="94" rx="14" fill="#20232c" stroke="#2e313b"/>
    <text x="758" y="202" fill="#9ca3af" font-family="Manrope, Segoe UI, sans-serif" font-size="14">TOTAL STUDENTS</text>
    <text x="758" y="242" fill="#fff" font-family="Manrope, Segoe UI, sans-serif" font-size="34" font-weight="800">192</text>

    <rect x="928" y="170" width="172" height="94" rx="14" fill="#20232c" stroke="#2e313b"/>
    <text x="948" y="202" fill="#9ca3af" font-family="Manrope, Segoe UI, sans-serif" font-size="14">ACTIVE CLASSES</text>
    <text x="948" y="242" fill="#fff" font-family="Manrope, Segoe UI, sans-serif" font-size="34" font-weight="800">8</text>

    <text x="738" y="307" fill="#fff" font-family="Manrope, Segoe UI, sans-serif" font-size="17" font-weight="700">Today by status</text>

    <g font-family="Manrope, Segoe UI, sans-serif">
      <rect x="738" y="328" width="362" height="48" rx="12" fill="#1d2826"/>
      <circle cx="762" cy="352" r="7" fill="#10b981"/>
      <text x="780" y="358" fill="#d1fae5" font-size="16">Present</text>
      <text x="1034" y="358" fill="#fff" text-anchor="end" font-size="18" font-weight="750">176</text>
      <text x="1082" y="358" fill="#6ee7b7" text-anchor="end" font-size="13">91.7%</text>

      <rect x="738" y="386" width="362" height="48" rx="12" fill="#2b2023"/>
      <circle cx="762" cy="410" r="7" fill="#ef4444"/>
      <text x="780" y="416" fill="#fee2e2" font-size="16">Absent</text>
      <text x="1034" y="416" fill="#fff" text-anchor="end" font-size="18" font-weight="750">8</text>
      <text x="1082" y="416" fill="#fca5a5" text-anchor="end" font-size="13">4.2%</text>

      <rect x="738" y="444" width="362" height="48" rx="12" fill="#2b271d"/>
      <circle cx="762" cy="468" r="7" fill="#f59e0b"/>
      <text x="780" y="474" fill="#fef3c7" font-size="16">Late arrival</text>
      <text x="1034" y="474" fill="#fff" text-anchor="end" font-size="18" font-weight="750">5</text>
      <text x="1082" y="474" fill="#fcd34d" text-anchor="end" font-size="13">2.6%</text>

      <rect x="738" y="502" width="362" height="48" rx="12" fill="#1d2533"/>
      <circle cx="762" cy="526" r="7" fill="#60a5fa"/>
      <text x="780" y="532" fill="#dbeafe" font-size="16">Half day</text>
      <text x="1034" y="532" fill="#fff" text-anchor="end" font-size="18" font-weight="750">3</text>
      <text x="1082" y="532" fill="#93c5fd" text-anchor="end" font-size="13">1.5%</text>
    </g>
  </g>
</svg>